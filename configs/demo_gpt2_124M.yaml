data_params:
  path2tokens: 'data/1M-wikipedia-gpt2-tokens-uint16.npy'
  stride: 1

model_params:
  model_name: GPT2
  vocab_size: 50257
  context_len: 1024
  n_transformer_blocks: 12
  head_num: 12
  emb_dim: 768
  proj_dim: 768
  ff_dim: 3072
  dropout_rate: 0.1

lr_params:
  warmup_steps: 100 #300
  max: 0.0003

trainer_params:
  device: 'cuda:1'
  batch_size: 8
  grad_acc_steps: 60
  data_workers: 4

log_params:
  log_dir: logs/GPT2
  seed: 42

eval_params:
  text_gen:
    seed_text: The capital of Italy is
    tokenizer: gpt2
    topk: 50
    max_len_return_seq: 25
    n_return_seq: 1
    seed: 42
